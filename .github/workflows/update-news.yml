name: Update motoring news

on:
  schedule:
    - cron: "15 6 * * *"   # daily, 06:15 UTC
  workflow_dispatch:        # allow a manual run from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh headlines
        run: python3 scripts/update_news.py
      - name: Commit if changed
        run: |
          if git diff --quiet market-insights.html; then
            echo "No change"
            exit 0
          fi
          git config user.name "news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-insights.html
          git commit -m "Update motoring news headlines"
          git push
